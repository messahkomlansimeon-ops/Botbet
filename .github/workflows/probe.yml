name: Kelly — sonde des sources
# Récupère un échantillon réel de chaque source (aucun crédit payant) pour valider les lecteurs.
on:
  push:
    paths: ["tools/probe.py", ".github/workflows/probe.yml", "kelly/sources/**", "kelly/bootstrap.py"]
  workflow_dispatch:
concurrency:
  group: botbet-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      # Test de bout en bout de kelly.sources en conditions réelles (dossier temporaire, aucun secret) : probe/sources_report.json
      - if: ${{ !cancelled() }}
        run: python tools/probe.py --sources
      - if: ${{ !cancelled() }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add probe
          git diff --cached --quiet || git commit -m "Sonde des sources $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin ${{ github.ref_name }} && git push
