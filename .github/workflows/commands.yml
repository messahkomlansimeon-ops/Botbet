name: Commandes Telegram
on:
  schedule:
    - cron: "*/30 * * * *"   # réponses dans la demi-heure ; pour l'instantané : python bot.py --serve sur un serveur
  workflow_dispatch:
concurrency:
  group: botbet-data
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bot.py --commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data
          git diff --cached --quiet || git commit -m "Commandes traitées"
          git pull --rebase origin ${{ github.ref_name }} && git push
