name: Combinés du jour
on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 Abidjan : envoi des combinés
    - cron: "0 20 * * *"   # 20:00 : relevé des cotes du lendemain (pas d'envoi)
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          # À 20:00 on relève seulement les cotes (pour voir les mouvements le matin).
          SNAPSHOT_ONLY: ${{ github.event.schedule == '0 20 * * *' && '1' || '' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SPORTS: "25"
          PROP_EVENTS: "8"
      - name: Sauvegarder l'historique des cotes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/odds_history.json
          git diff --cached --quiet || git commit -m "Relevé des cotes"
          git push
